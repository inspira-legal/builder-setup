name: e2e Safira (temporário)
on:
  pull_request:
    branches: [main]
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run scripts/e2e-safira.ts
      - name: Coder no PATH do sistema (novo terminal)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $m = [Environment]::GetEnvironmentVariable('Path','Machine')
          if (($m -split ';') -notcontains (Join-Path $env:ProgramFiles 'Coder\bin')) { throw 'Coder fora do PATH do sistema' }
          $env:Path = $m + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          coder version
